name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 注意：本仓库直接提交已构建好的 main.js / styles.css，
      # 此处不再重新构建（避免产物与本地现有文件不一致）。
      - name: Verify release artifacts present
        run: |
          for f in manifest.json main.js styles.css; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少发布文件 $f（请确保已提交到仓库）"
              exit 1
            fi
          done

      - name: Generate release notes
        run: |
          {
            echo "## BDNSync ${{ github.ref_name }}"
            echo ""
            echo "### 安装"
            echo ""
            echo "1. 下载下方三个文件"
            echo "2. 放入 vault 的 \`.obsidian/plugins/bdnsync/\` 目录"
            echo "3. 在 Obsidian 设置 → 第三方插件中启用 BDNSync"
            echo ""
            echo "### 插件文件"
            echo ""
            echo "- \`manifest.json\` — 插件清单"
            echo "- \`main.js\` — 编译后的运行代码"
            echo "- \`styles.css\` — 界面样式"
            echo ""
            echo "### 更新日志"
            echo ""
          } > RELEASE_NOTES.md
          if [ -f CHANGELOG.md ]; then
            # 兼容 CHANGELOG 中的 "## [1.0.1]" 与标签名 "v1.0.1"（带或不带 v 前缀）
            VERSION="${{ github.ref_name }}"
            VERSION_NO_V="${VERSION#v}"
            awk -v v="$VERSION" -v nv="$VERSION_NO_V" '
              /^## \[/ {
                hdr = $0
                sub(/^## \[/, "", hdr)
                sub(/\].*/, "", hdr)
                if (hdr == v || hdr == nv) { flag = 1; next }
                else { flag = 0 }
              }
              flag
            ' CHANGELOG.md >> RELEASE_NOTES.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            manifest.json
            main.js
            styles.css
